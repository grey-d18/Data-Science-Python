# Entorno para asr_motores_transcripcion.ipynb (faster-whisper + pyannote + OpenAI API)
#
#   conda env create -f environment.yml
#   conda activate asr-voz
#   python -m ipykernel install --user --name asr-voz --display-name "Python (asr-voz)"
#
# pyannote.audio va fijado en 3.4: el notebook usa `use_auth_token=` y el pipeline
# speaker-diarization-3.1, que en 4.x cambian. pyannote 3.4 no funciona con torchaudio>=2.9.
name: asr-voz
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - faster-whisper==1.2.1
      - av<19                 # av 19 quitó `metadata_errors`, que faster-whisper 1.2.1 usa
      - pyannote.audio==3.4.0
      - torch==2.8.0
      - torchaudio==2.8.0
      - openai>=1.50
      - python-dotenv>=1.0
      - sounddevice>=0.5
      - scipy>=1.13
      - numpy>=1.26
      - aiohttp>=3.9
      - ipykernel>=6.29
